<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O-note</title>
  <meta name="description" content="오타쿠를 위한 자료 모음 & 메모장 — 캐릭터 위키, 세계관, 연성, 플롯·타임라인, 메모">
  <meta name="theme-color" content="#7b6cf6">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <!-- 보안 정책: 외부 스크립트 금지, Supabase API로만 통신 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; upgrade-insecure-requests">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/https.js"></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="vendor/supabase.js" defer></script>
  <script src="vendor/html2canvas.min.js" defer></script>
  <!-- 위키 문서 엔진 (위키 문서 공방에서 가져옴) -->
  <script src="vendor/nw/renderer.js" defer></script>
  <script src="vendor/nw/editor.js" defer></script>
  <script src="vendor/nw/table-tools.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app"><div class="center-box"><div class="spinner"></div></div></div>
  <noscript>O-note를 사용하려면 자바스크립트를 켜주세요.</noscript>
</body>
</html>
